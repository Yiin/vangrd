name: Refresh product changelog

on:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-product-changelog
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test the importer
        run: node --test scripts/refresh-changelog.test.mjs
      - name: Download the public product notes
        run: >-
          curl --fail --silent --show-error --location
          --proto '=https' --proto-redir '=https'
          --max-time 60 --retry 2
          https://vangrd.bot/changelog.json
          --output "$RUNNER_TEMP/changelog.json"
      - name: Refresh and verify the documentation
        run: |
          node scripts/refresh-changelog.mjs "$RUNNER_TEMP/changelog.json"
          node scripts/refresh-changelog.mjs --check "$RUNNER_TEMP/changelog.json"
          git diff --check
      - name: Commit changed product notes
        run: |
          if git diff --quiet -- README.md CHANGELOG.md; then
            echo 'Product notes are current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md
          git commit -m 'docs: refresh product changelog'
          git push
